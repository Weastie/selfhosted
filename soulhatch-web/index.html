<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css"
    >
      <link rel="preconnect" href="https://fonts.googleapis.com">
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
      <link href="https://fonts.googleapis.com/css2?family=Special+Elite&display=swap" rel="stylesheet">
      <style>
        /* 2. Custom styling for the hero banner */
        header.hero-banner {
          /* Full-bleed properties */
          background:
            /* Dark overlay for text readability */
            linear-gradient(rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.5)),
            /* Your background image */
            url('photos/banner.jpg');
          background-size: cover;
          background-position: center 100%;

          /* Height and padding */
          min-height: 50vh;
          display: flex;
          align-items: center;
          color: white;
          text-align: center;
        }

        header.hero-banner h1 {
            --pico-font-family: "Special Elite", system-ui;
            --pico-font-weight: 400;
            --pico-font-size: 400%;
            --pico-typography-spacing-vertical: 0.5rem;
            --pico-color: white
        }

        header.hero-banner h2 {
            --pico-font-family: "Special Elite", system-ui;
            --pico-font-weight: 400;
            --pico-font-size: 200%;
            --pico-typography-spacing-vertical: 0.5rem;
            --pico-color: white
        }
      </style>
      <script type="module">
        var events = [
          {
            "title": "Orpheus' Garden",
            "date": "Sep 19",
            "time": "8pm",
            "description": "Soul Hatch is playing alongside Rachel Folmar, James Judas, and Pachyderm",
            "image": "./photos/OrpheusGarden-flyer-2026.jpg"
          },
          {
            "title": "Punch Buggy Brewing",
            "date": "Oct 17",
            "time": "8pm",
            "description": "Soul Hatch will be boogy-ing all night long at Punch Buggy Brewing Co",
            "image": ""
          },
        ]

        for (event in events) {
          let e = events[event]
          console.log(event)
                  let event_code = `
                  <details open>
        <summary>[${e.date}] ${e.title}</summary>
        <p>${e.description}</p>`
          if (e.image.length > 0) {
            event_code += `<img src="${e.image}" style="width: 75%">`
          }
          event_code += `</details>`
          document.getElementById("events").insertAdjacentHTML('beforeend', event_code)
        }
      </script>
      <title>Soul Hatch</title>
    </head>
    <body>
      <header class='hero-banner'>
        <div class='container'>
          <h1>Soul Hatch</h1>
          <h2>Blues, Funk, and Pop from Philly</h2>
        </div>
      </header>
      <main class="container">
        <div class="grid">
          <div>
            <article>
              <h2>Upcoming Events</h2>
              <div id="events" style="margin-left: 20px"></div>
            </article>
          </div>
          <div>
            <!--<article style="width: 75%; margin-inline: auto">-->
            <article>
              <h1>Sign up for our mailing list</h1>
              <form method="post" action="https://listmonk.soulhatch.band/subscription/form" class="listmonk-form">
                <div>
                  <h3>Subscribe</h3>
                  <input type="hidden" name="nonce" />
                  <p><input type="email" name="email" required placeholder="E-mail" /></p>
                  <p><input type="text" name="name" placeholder="Name (optional)" /></p>
                  <p>
                    <input id="531d2" type="checkbox" name="l" checked value="531d2448-8927-4046-ba12-bfa9cc874ba2" />
                    <label for="531d2">Soul Hatch Events</label>
                    <br />
                    <span>Sign up for Soul Hatch Mailing List</span>
                  </p>
                  <input type="submit" value="Subscribe " />
                </div>
              </form>
            </article>
          </div>
        </div>
      </main>
    </body>
  </html>

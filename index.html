<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Special+Elite&display=swap"
      rel="stylesheet"
    />
    <style>
      /* 2. Custom styling for the hero banner */
      div.hero-banner {
        /* Full-bleed properties */
        background:
            /* Dark overlay for text readability */
          linear-gradient(rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.5)),
          /* Your background image */ url("photos/banner.jpg");
        background-size: cover;
        background-position: center 100%;

        /* Height and padding */
        min-height: 50vh;
        display: flex;
        align-items: center;
        color: white;
        text-align: center;
      }

      div.hero-banner * {
        --pico-color: white;
      }

      .nav-container * {
        --pico-color: white;
        text-align: center;
      }

      .nav-container {
        position: absolute;
        left: 0;
        right: 0;
        margin-left: auto;
        margin-right: auto;
      }

      .nav-container nav {
        width: 100%;
      }

      div.hero-banner h1 {
        --pico-font-family: "Special Elite", system-ui;
        --pico-font-weight: 400;
        --pico-font-size: 400%;
        --pico-typography-spacing-vertical: 0.5rem;
      }

      div.hero-banner h2 {
        --pico-font-family: "Special Elite", system-ui;
        --pico-font-weight: 400;
        --pico-font-size: 200%;
        --pico-typography-spacing-vertical: 0.5rem;
      }
    </style>
    <script type="module">
      var events = [
        {
          title: "Orpheus' Garden",
          date: "Sep 19",
          time: "8pm",
          description:
            "Soul Hatch is playing alongside Rachel Folmar, James Judas, and Pachyderm",
          image: "./photos/OrpheusGarden-flyer-2026.jpg",
        },
        {
          title: "Punch Buggy Brewing",
          date: "Oct 17",
          time: "8pm",
          description:
            "Soul Hatch will be boogy-ing all night long at Punch Buggy Brewing Co",
          image: "",
        },
      ];

      for (event in events) {
        let e = events[event];
        console.log(event);
        let event_code = `
                  <details open>
        <summary>[${e.date}] ${e.title}</summary>
        <p>${e.description}</p>`;
        if (e.image.length > 0) {
          event_code += `<img src="${e.image}" style="width: 75%">`;
        }
        event_code += `</details>`;
        document
          .getElementById("events")
          .insertAdjacentHTML("beforeend", event_code);
      }
    </script>
    <title>Soul Hatch</title>
  </head>
  <body>
    <header>
      <div class="container nav-container">
        <nav>
          <ul>
            <li><a href="/">Home</a></li>
          </ul>
          <ul>
            <li>
              <a href="https://instagram.com/soulhatch">
                <!-- Instagram Icon -->
                <svg
                  viewBox="0 0 24 24"
                  width="20"
                  height="20"
                  fill="currentColor"
                  style="margin-right: 8px"
                >
                  <path
                    d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zM12 0C8.741 0 8.333.014 7.053.072 2.695.272.273 2.69.073 7.051.014 8.333 0 8.741 0 12c0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98C15.668.014 15.259 0 12 0zm0 5.838a6.162 6.162 0 1 0 0 12.324 6.162 6.162 0 0 0 0-12.324zM12 16a4 4 0 1 1 0-8 4 4 0 0 1 0 8zm6.406-11.845a1.44 1.44 0 1 0 0 2.881 1.44 1.44 0 0 0 0-2.881z"
                  /></svg
              ></a>
            </li>
            <li>
              <a href="https://soulhatch.bandcamp.com">
                <!-- Bandcamp Icon SVG -->
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  viewBox="0 0 24 24"
                  width="24"
                  height="24"
                  fill="currentColor"
                >
                  <path d="M0 18.75l7.437-13.5H24l-7.438 13.5H0z" />
                </svg>
              </a>
            </li>
          </ul>
        </nav>
      </div>
      <div class="hero-banner">
        <div class="container">
          <h1>Soul Hatch</h1>
          <h2>Your one stop shop for all your cosmic-chaotic needs</h2>
        </div>
      </div>
    </header>
    <main class="container">
      <div class="grid">
        <div>
          <article>
            <h2>Upcoming Events</h2>
            <div id="events" style="margin-left: 20px"></div>
          </article>
        </div>
        <div>
          <!--<article style="width: 75%; margin-inline: auto">-->
          <article>
            <h1>Sign up for our mailing list</h1>
            <form
              method="post"
              action="https://listmonk.soulhatch.band/subscription/form"
              class="listmonk-form"
            >
              <div>
                <h3>Subscribe</h3>
                <input type="hidden" name="nonce" />
                <p>
                  <input
                    type="email"
                    name="email"
                    required
                    placeholder="E-mail"
                  />
                </p>
                <p>
                  <input
                    type="text"
                    name="name"
                    placeholder="Name (optional)"
                  />
                </p>
                <p>
                  <input
                    id="531d2"
                    type="checkbox"
                    name="l"
                    checked
                    value="531d2448-8927-4046-ba12-bfa9cc874ba2"
                  />
                  <label for="531d2">Soul Hatch Events</label>
                  <br />
                  <span>Sign up for Soul Hatch Mailing List</span>
                </p>
                <input type="submit" value="Subscribe " />
              </div>
            </form>
          </article>
        </div>
      </div>
    </main>
    <footer></footer>
  </body>
</html>

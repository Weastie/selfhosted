<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Soul Hatch Link Tree</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.colors.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Special+Elite&amp;display=swap" rel="stylesheet">
    <style>
      body {
          background-color: var(--pico-color-blue-750);
          min-height: 100vh;
        }
      a {
          width: 100%;
          border: 3px solid var(--pico-color-zinc-150);
          border-radius: 25px;
          background-color: var(--pico-color-violet-750);
          text-align: center;
          color: var(--pico-color-azure-50);
          margin: 0 !important
        }
      a:hover {
          text-decoration: none;
        }
      h1 {
          color: var(--pico-color-azure-50);
          }
      header {
          padding-top: 15px;
      
        }
        header h1 {
            padding-top: 10px;
          }
        a:hover {
            background-color: var(--pico-color-violet-550);
          }
      li {
          margin-bottom: 20px !important;
        }
      .logo {
          width: 150px;           /* Set desired size */
          aspect-ratio: 1 / 1;    /* Force a perfect square frame */
          border-radius: 50%;     /* Turn square frame into a circle */
          object-fit: cover;      /* Crop content without squishing */
        }
      
    </style>
  </head>

    <div class="container">
      <header>
        <center><img class="logo" src="/photos/logo.png">
          <h1>Soul Hatch Link Tree</h1>
        </center>
      </header>
      <main>
        <aside>
          <nav>
